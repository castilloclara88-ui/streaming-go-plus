[package]
name = "control-tauri"
version = "1.0.0"
description = "Sistema de Gestión - Streaming"
authors = ["Diego"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "shell-open" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29.0", features = ["bundled"] }

[features]
# this feature is used for production builds or when `devPath` points to the HTML file
# Prevent pressing F12 in production
custom-protocol = ["tauri/custom-protocol"]
